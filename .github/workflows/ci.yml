on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Check formatting
        run: crystal tool format --check
      - name: Build
        run: shards install
      - name: Run tests
        run: crystal spec --order=random
